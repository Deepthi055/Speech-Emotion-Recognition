experiment:
  name: "wavlm_ce_baseline"
  variant: "ce"
  device: "cpu"

model:
  model_id: "microsoft/wavlm-base"
  embedding_dim: 768
  num_classes: 6
  pooling: "mean"
  frozen: true

data:
  metadata_dir: "data/metadata"
  embeddings_dir: "data/embeddings"
  train_npz: "data/embeddings/wavlm_mean_train.npz"
  val_npz: "data/embeddings/wavlm_mean_val.npz"
  test_npz: "data/embeddings/wavlm_mean_test.npz"
  target_sr: 16000

training:
  epochs: 30
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  patience: 7
  output_dir: "runs/wavlm_ce_baseline"
