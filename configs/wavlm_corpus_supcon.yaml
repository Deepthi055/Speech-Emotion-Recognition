experiment:
  name: "wavlm_corpus_supcon"
  variant: "corpus_supcon"
  device: "cpu"

model:
  in_dim: 768
  proj_dim: 128
  num_classes: 6

data:
  train_npz: "data/embeddings/wavlm_mean_train.npz"
  val_npz: "data/embeddings/wavlm_mean_val.npz"
  test_npz: "data/embeddings/wavlm_mean_test.npz"

loss:
  temperature: 0.07

training:
  epochs: 30
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  supcon_weight: 1.0
  ce_weight: 1.0
  patience: 7
  output_dir: "runs/wavlm_corpus_supcon"
