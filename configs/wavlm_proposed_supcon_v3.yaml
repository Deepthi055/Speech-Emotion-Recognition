experiment:
  name: "wavlm_proposed_supcon_v3"
  variant: "proposed_supcon"
  device: "cpu"

model:
  in_dim: 768
  proj_dim: 128
  num_classes: 6

data:
  train_npz: "data/embeddings/wavlm_mean_train.npz"
  val_npz: "data/embeddings/wavlm_mean_val.npz"
  test_npz: "data/embeddings/wavlm_mean_test.npz"

loss:
  temperature: 0.07

training:
  epochs: 30
  batch_size: 64
  lr: 0.001
  weight_decay: 0.0001
  supcon_weight: 1.0
  ce_weight: 1.0
  patience: 7
  output_dir: "runs/wavlm_proposed_supcon_v3"
  # --- CE weights + stratified sampling ---
  # Both improvements combined. Compare against v2 to isolate sampler contribution.
  use_class_weights: true
  sampler_type: "stratified"
