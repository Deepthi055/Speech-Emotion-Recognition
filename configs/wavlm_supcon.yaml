experiment:
  name: "wavlm_supcon"
  variant: "standard_supcon"

model:
  model_id: "microsoft/wavlm-base"
  num_classes: 6
  proj_dim: 128
  use_projection: true
  use_classifier: true

data:
  train_csv: "data/metadata/train_step5.csv"
  val_csv: "data/metadata/validation_step5.csv"
  test_csv: "data/metadata/test_step5.csv"
  target_sr: 16000
  max_seconds: 6.0

sampler:
  type: "standard"
  batch_size: 16
  shuffle: true

loss:
  temperature: 0.07

training:
  epochs: 10
  lr: 1e-4
  weight_decay: 1e-4
  supcon_weight: 1.0
  ce_weight: 1.0
